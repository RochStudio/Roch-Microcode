[package]
name = "roch-fixture-tests"
description = "Firmware fixture regression suites for Roch Microcode (ports of tests/RochBios.*)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "roch-tests"
path = "src/bin/roch_tests.rs"

[[bin]]
name = "roch-transfer-tests"
path = "src/bin/roch_transfer_tests.rs"

[[bin]]
name = "roch-profile-tests"
path = "src/bin/roch_profile_tests.rs"

[dependencies]
roch-core = { path = "../roch-core", features = ["online-downloads"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = "1"
serde_json = "1"

[[bin]]
name = "roch-make-synthetic"
path = "src/bin/roch_make_synthetic.rs"
