name: Publish existing release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and package current version
        shell: pwsh
        run: |
          ./build.ps1
          $match = Select-String -LiteralPath Cargo.toml -Pattern '^version = "(\d+\.\d+\.\d+)"' | Select-Object -First 1
          if ($null -eq $match) { throw 'Invalid release version' }
          $version = $match.Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Path release-output | Out-Null
          $windowsName = "RochMicrocode-$version-win-x64.zip"
          $sourceName = "RochMicrocode-$version-source.zip"
          Compress-Archive -Path dist/* -DestinationPath "release-output/$windowsName"
          git archive --format=zip --prefix="Roch-Microcode-$version/" --output="release-output/$sourceName" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $hashes = @((Get-FileHash dist/RochMicrocode.exe).Hash + '  RochMicrocode.exe')
          foreach ($name in @($windowsName, $sourceName)) { $hashes += (Get-FileHash "release-output/$name").Hash + '  ' + $name }
          $hashes | Set-Content "release-output/RochMicrocode-$version-SHA256.txt"
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
      - name: Upload assets to the existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Create and review the release before publishing assets' }
          foreach ($file in Get-ChildItem release-output -File) {
            gh release upload $env:RELEASE_TAG $file.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Upload failed: $($file.Name)" }
          }
